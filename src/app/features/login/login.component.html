<div class="login-container">
    <form (ngSubmit)="login()" class="login-card">
  
      <h2>Connexion Admin</h2>
  
      <input 
        type="email" 
        placeholder="Email"
        [(ngModel)]="email"
        name="email"
        required />
  
      <input 
        type="password" 
        placeholder="Mot de passe"
        [(ngModel)]="password"
        name="password"
        required />
  
      <button type="submit" [disabled]="loading()">
        <span *ngIf="!loading()">Se connecter</span>
        <span *ngIf="loading()" class="dice-loader dice-loader--sm" aria-hidden="true">
          <span class="die d1"></span>
          <span class="die d2"></span>
          <span class="die d3"></span>
        </span>
        <span *ngIf="loading()" class="sr-only">Connexion en cours</span>
      </button>
  
      <p class="error" *ngIf="error()">{{ error() }}</p>
  
    </form>
  </div>
