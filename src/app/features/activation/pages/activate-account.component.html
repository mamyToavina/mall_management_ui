<section class="activation-page">
  <div class="activation-card">
    <header>
      <h1>Activation du compte boutique</h1>
      <p class="sub">Completez vos informations pour finaliser l activation.</p>
    </header>

    <div class="banner error" *ngIf="error">{{ error }}</div>
    <div class="banner success" *ngIf="success">
      {{ success }} Redirection vers la page login...
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="grid" novalidate>
      <div class="field">
        <label>Pseudo</label>
        <input formControlName="pseudo" autocomplete="username" />
      </div>

      <div class="field">
        <label>Nom boutique</label>
        <input formControlName="boutiqueName" />
      </div>

      <div class="field">
        <label>Activite principale</label>
        <input formControlName="activity" placeholder="Ex: Mode, Tech, Cosmetique..." />
      </div>

      <div class="field field-full">
        <label>Ce que vous vendez</label>
        <textarea formControlName="offerings" rows="2" placeholder="Produits ou services proposes"></textarea>
      </div>

      <div class="field field-full">
        <label>Phrase publicitaire</label>
        <input formControlName="marketingTagline" placeholder="Ex: Qualite premium au meilleur prix" />
      </div>

      <div class="field field-full">
        <label>Description publique</label>
        <textarea formControlName="publicDescription" rows="3" placeholder="Presentation de votre boutique"></textarea>
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <input type="password" formControlName="password" autocomplete="new-password" />
      </div>

      <div class="field">
        <label>Confirmation mot de passe</label>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      </div>

      <div class="field">
        <label>Prenom (optionnel)</label>
        <input formControlName="firstName" />
      </div>

      <div class="field">
        <label>Nom (optionnel)</label>
        <input formControlName="lastName" />
      </div>

      <div class="field">
        <label>Genre (optionnel)</label>
        <select formControlName="gender">
          <option value="">Selectionner</option>
          <option value="Male">Homme</option>
          <option value="Female">Femme</option>
          <option value="Other">Autre</option>
        </select>
      </div>

      <div class="field">
        <label>Logo boutique (drag and drop)</label>
        <div
          class="dropzone"
          [class.drag-active]="dragActive"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)"
        >
          <input type="file" accept="image/*" (change)="onFileChange($event)" />
          <div class="drop-copy">
            Glissez une image ici ou cliquez pour choisir
          </div>
        </div>
        <img class="logo-preview" *ngIf="logoPreview" [src]="logoPreview" alt="Apercu logo" />
      </div>

      <div class="field field-full switch-row">
        <label>
          <input type="checkbox" formControlName="onlineSalesEnabled" />
          Activer les ventes en ligne
        </label>
      </div>

      <div *ngIf="loading" class="loading-state" role="status" aria-live="polite" aria-label="Activation en cours">
        <div class="dice-loader" aria-hidden="true">
          <span class="die d1"></span>
          <span class="die d2"></span>
          <span class="die d3"></span>
        </div>
        <span class="sr-only">Activation en cours</span>
      </div>

      <div class="actions field-full">
        <button class="btn primary" type="submit" [disabled]="loading">Finaliser l activation</button>
        <a class="btn ghost" routerLink="/login">Retour login</a>
      </div>
    </form>
  </div>
</section>
