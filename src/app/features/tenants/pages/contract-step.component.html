<section class="wizard-page">
  <div class="step-card">
    <header class="wizard-head">
      <div>
        <h2>Contrat de location</h2>
        <p class="sub">Etape 2/2: informations du contrat et validation</p>
      </div>
      <div class="progress" aria-hidden="true">
        <span class="dot done"></span>
        <span class="line done"></span>
        <span class="dot active pulse"></span>
      </div>
    </header>

    <form [formGroup]="form" (ngSubmit)="submitAll()" class="wizard-form" novalidate>
      <div class="field">
        <label for="startDate">Date de debut</label>
        <input id="startDate" type="date" formControlName="startDate" />
        <small *ngIf="form.get('startDate')?.touched && form.get('startDate')?.invalid">
          Date de debut obligatoire.
        </small>
      </div>

      <div class="field">
        <label for="durationMonths">Duree (mois)</label>
        <input id="durationMonths" type="number" min="3" formControlName="durationMonths" />
        <small *ngIf="form.get('durationMonths')?.touched && form.get('durationMonths')?.invalid">
          Duree minimale: 3 mois.
        </small>
      </div>

      <div class="field field-full">
        <label for="monthlyRent">Loyer mensuel</label>
        <input id="monthlyRent" type="number" min="0" formControlName="monthlyRent" />
        <small *ngIf="form.get('monthlyRent')?.touched && form.get('monthlyRent')?.invalid">
          Loyer obligatoire et superieur ou egal a 0.
        </small>
      </div>

      <div class="field field-full">
        <label for="details">Details</label>
        <textarea id="details" formControlName="details" rows="4" placeholder="Informations complementaires"></textarea>
      </div>

      <div class="banner error" *ngIf="submitError">{{ submitError }}</div>

      <div class="banner success" *ngIf="submitSuccess">
        <div>{{ submitSuccess }}</div>
        <div class="meta" *ngIf="apiResult?.activationLink">
          Lien activation:
          <a class="activation-link" [href]="apiResult?.activationLink" target="_blank" rel="noopener noreferrer">
            {{ apiResult?.activationLink }}
          </a>
        </div>
      </div>

      <div *ngIf="submitting" class="loading-state" role="status" aria-live="polite" aria-label="Creation en cours">
        <div class="dice-loader" aria-hidden="true">
          <span class="die d1"></span>
          <span class="die d2"></span>
          <span class="die d3"></span>
        </div>
        <span class="sr-only">Creation en cours</span>
      </div>

      <div class="actions">
        <button type="button" class="btn ghost" (click)="back()" [disabled]="submitting">Retour</button>
        <button
          type="button"
          class="btn ghost"
          *ngIf="submitSuccess"
          (click)="createAnother()"
        >
          Creer un autre locataire
        </button>
        <button type="submit" class="btn primary" [disabled]="submitting">
          <span *ngIf="!submitting">Creer le locataire</span>
          <span *ngIf="submitting" class="dice-loader dice-loader--sm" aria-hidden="true">
            <span class="die d1"></span>
            <span class="die d2"></span>
            <span class="die d3"></span>
          </span>
          <span *ngIf="submitting" class="sr-only">Creation en cours</span>
        </button>
      </div>
    </form>
  </div>
</section>
