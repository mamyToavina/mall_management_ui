<div class="p-4">
    <h2 class="text-xl font-semibold mb-4">Détails box</h2>
  
    <div *ngIf="loading" class="py-6">Chargement...</div>

  
    <div *ngIf="box" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="border rounded p-3">
        <h3 class="font-semibold mb-2">Box</h3>
        <pre class="text-xs overflow-auto">{{ box | json }}</pre>
      </div>
  
      <div class="border rounded p-3">
        <h3 class="font-semibold mb-2">Contract ACTIVE</h3>
        <div *ngIf="!contract" class="text-gray-500">Aucun contrat actif</div>
        <pre *ngIf="contract" class="text-xs overflow-auto">{{ contract | json }}</pre>
      </div>
    </div>
  </div>
